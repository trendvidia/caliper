name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: vet + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Build/test on the trendvidia/go ("go-plus") fork — dogfooding the
      # compiler across private repos. setup-go-plus mints a scoped token from
      # the GitHub App to fetch the fork's release tarball.
      - name: Set up go-plus
        uses: trendvidia/setup-go-plus@v1
        with:
          version: v1.26.5
          app-id: ${{ secrets.GOPLUS_APP_ID }}
          private-key: ${{ secrets.GOPLUS_APP_KEY }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: gomod-${{ runner.os }}-${{ hashFiles('**/go.sum') }}
          restore-keys: gomod-${{ runner.os }}-

      - name: gofmt
        run: |
          out=$(gofmt -l ./pkg ./cmd)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # go-plus toolchain. golangci-lint manages its own cache, so there is no
      # module cache step here (setup-go-plus caches only the toolchain).
      - name: Set up go-plus
        uses: trendvidia/setup-go-plus@v1
        with:
          version: v1.26.5
          app-id: ${{ secrets.GOPLUS_APP_ID }}
          private-key: ${{ secrets.GOPLUS_APP_KEY }}

      - uses: golangci/golangci-lint-action@v8
        with:
          # Pin to v2.x — the action's "latest" otherwise resolves to a
          # v1.x release built with an older Go and chokes on go.mod's
          # 1.26 directive ("Go language version used to build
          # golangci-lint is lower than the targeted Go version"). v2
          # uses the same .golangci.yml schema this repo ships.
          version: v2.10.1
          args: --timeout=5m
