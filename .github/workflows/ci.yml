name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# GitHub-hosted runners only. A public repository must not route jobs to a
# self-hosted runner: a fork's pull request runs the workflow file from the
# fork, so it can pick any runner label the repository has.
jobs:
  test:
    name: vet + build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'

      - name: gofmt
        run: |
          out=$(gofmt -l ./pkg ./cmd)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.2'

      - uses: golangci/golangci-lint-action@v8
        with:
          # Pin to v2.x — the action's "latest" otherwise resolves to a
          # v1.x release built with an older Go and chokes on go.mod's
          # 1.26 directive ("Go language version used to build
          # golangci-lint is lower than the targeted Go version"). v2
          # uses the same .golangci.yml schema this repo ships.
          version: v2.14.0
          args: --timeout=5m
