name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: vet + build + test
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5

      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -qE '\(plus[ )]' || { echo "::error::runner go is not the go-plus fork"; exit 1; }

      - name: gofmt
        run: |
          out=$(gofmt -l ./pkg ./cmd)
          if [ -n "$out" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v5

      - name: Assert go-plus toolchain
        run: |
          go version
          go version | grep -qE '\(plus[ )]' || { echo "::error::runner go is not the go-plus fork"; exit 1; }

      - uses: golangci/golangci-lint-action@v8
        with:
          # Pin to v2.x — the action's "latest" otherwise resolves to a
          # v1.x release built with an older Go and chokes on go.mod's
          # 1.26 directive ("Go language version used to build
          # golangci-lint is lower than the targeted Go version"). v2
          # uses the same .golangci.yml schema this repo ships.
          version: v2.10.1
          # Build the linter with the runner's toolchain instead of
          # downloading a prebuilt binary. The prebuilt release is built
          # against upstream Go, and this runner deliberately uses the
          # go-plus fork (asserted above); analysing a forked stdlib with
          # an analyzer built elsewhere loses facts staticcheck depends
          # on. Concretely it stopped deriving that testing.T.Fatal does
          # not return, and reported six SA5011 "possible nil pointer
          # dereference" false positives in matcher_test.go — code
          # unchanged since April, where `if b == nil { t.Fatal(...) }`
          # makes the following deref safe. The same v2.10.1 run through
          # `go run` locally, compiled with go-plus, reports 0 issues.
          install-mode: goinstall
          args: --timeout=5m
