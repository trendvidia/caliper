syntax = "proto3";

package caliper.v1;

option go_package = "github.com/trendvidia/caliper/pkg/caliperpb";

// Config is the top-level Caliper configuration.
message Config {
  // Severity overrides per rule kind (e.g., "resource_leak": "error").
  map<string, string> severity = 1;

  // Rules controls which analysis rules are enabled or disabled.
  RulesConfig rules = 2;

  // Engine configures package loading behavior.
  EngineConfig engine = 3;

  // Defaults sets default parameter values for tool calls.
  DefaultsConfig defaults = 4;

  // Patterns lists paths to .gcl pattern files. Supports globs.
  repeated string patterns = 5;

  // Infallible extends find_unchecked_error's allowlist with project-local
  // APIs whose error returns are known not to occur in practice.
  Infallible infallible = 6;
}

// RulesConfig controls which rules are active.
message RulesConfig {
  // If non-empty, only these rules are active.
  repeated string enable = 1;
  // Rules to skip. Applied after enable.
  repeated string disable = 2;
}

// EngineConfig controls package loading.
message EngineConfig {
  // Skip files with "// Code generated" headers. Default: true.
  bool skip_generated = 1;
  // Skip files that import "C". Default: true.
  bool skip_cgo = 2;
  // Build tags for package loading.
  repeated string build_tags = 3;
  // LRU engine cache size. Default: 8.
  int32 max_cache_entries = 4;
}

// DefaultsConfig provides default values for tool parameters.
message DefaultsConfig {
  // Default analysis path if none is specified.
  string path = 1;
  // Whether transforms default to preview mode. Default: true.
  bool preview = 2;
}

// Infallible extends find_unchecked_error's allowlist with project-local
// or third-party APIs whose error returns are known not to occur in
// practice. Each entry is either an exact string or a glob pattern (use
// "*" to match any sequence of characters, including dots and slashes).
message Infallible {
  // Methods whose error return is always nil.
  // Format: "<pkgpath>.<TypeName>.<Method>"
  // Example: "github.com/myorg/mylib.Logger.Debug"
  repeated string methods = 1;

  // Package-level functions whose error return is always nil.
  // Format: "<pkgpath>.<Function>"
  // Example: "github.com/myorg/mylib.Trace"
  repeated string functions = 2;

  // Writer types whose Write* methods are infallible. Calls of the
  // writer-arg family (fmt.Fprint*, io.WriteString) become transitively
  // infallible when their first arg is one of these.
  // Format: "<pkgpath>.<TypeName>"
  repeated string writers = 3;

  // Hardcoded stdlib entries to re-enable flagging for. Same key formats
  // as above; useful when project policy demands checking errors that
  // caliper would otherwise treat as infallible by default.
  repeated string disable_methods = 4;
  repeated string disable_functions = 5;
  repeated string disable_writers = 6;
}
